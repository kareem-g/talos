[package]
name = "agentdeck-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace deps
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
xdg = { workspace = true }
hostname = "0.4"

# Backend-specific
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
bytes = "1.7"
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# PTY / Process management
portable-pty = "0.8"
nix = { version = "0.29", features = ["process", "signal", "term", "fs"] }

# WebSocket
tokio-tungstenite = "0.24"

# Crypto
ed25519-dalek = "2.1"
x25519-dalek = "2.0"

# Config
toml = "0.8"

# mDNS
mdns-sd = "0.11"

# Notifications
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

# TUI (for terminal dashboard mode)
ratatui = { workspace = true }
crossterm = { workspace = true }

# Shared crate
agentdeck-shared = { path = "../shared" }
web-push = { version = "0.11", default-features = false }

# Remote view / control. Platform backends live behind `cfg(target_os)` so a
# Linux build never pulls in the macOS frameworks and vice versa.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xtest", "xfixes", "allow-unsafe-code"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tokio-test = "0.4"
