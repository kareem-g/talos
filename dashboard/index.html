<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Keep this equal to --canvas in index.css: iOS paints the status bar and
         home-indicator safe areas with this colour, so a darker value shows as a
         black band along the screen edges when the app is installed. -->
    <meta name="theme-color" content="#141210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QAI" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- IBM Plex: engineered character for a control station; JetBrains Mono for code. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>QAI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Pre-paint theme: mirror lib/theme.ts using the stored prefs so a light
         user never sees a dark flash. Must run before the stylesheet paints. -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('agentdeck-theme')
          if (mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'system'
          var resolved =
            mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : mode === 'light'
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = resolved
          var accent = localStorage.getItem('agentdeck-accent')
          if (accent && /^#?[0-9a-f]{6}$/i.test(accent)) {
            var s = document.documentElement.style
            s.setProperty('--accent', accent)
            s.setProperty('--accent-hover', accent)
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
