name: iOS

# Continuous integration for the AgentDeck iOS companion app: unit tests on
# the simulator plus an unsigned IPA artifact. IPAs cannot be produced on
# Linux, so CI (a macOS runner) is where the app actually gets built.
on:
  push:
    branches: [main, "ios-*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - ".github/workflows/ios-release.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
      - ".github/workflows/ios-release.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m1 iPhone || true

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/AgentDeck.xcodeproj \
            -scheme AgentDeck \
            -destination 'platform=iOS Simulator,name=iPhone 16' 2>&1 | grep -vE "^Test (Case|Suite)" | tail -n 400

      - name: Build unsigned IPA
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/AgentDeck.xcodeproj \
            -scheme AgentDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AgentDeck.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

          mkdir -p build/Payload
          cp -R "build/AgentDeck.xcarchive/Products/Applications/AgentDeck.app" build/Payload/
          cd build && zip -qry AgentDeck-unsigned.ipa Payload

          echo "## iOS build" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned IPA: AgentDeck-unsigned.ipa (re-sign with Sideloadly/AltStore, or use the release pipeline for a signed build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-unsigned-ipa
          path: build/AgentDeck-unsigned.ipa
          retention-days: 14
