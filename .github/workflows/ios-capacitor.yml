name: iOS (Capacitor shell)

# Native shell around the dashboard bundle. One React codebase, two clients:
# the PWA the daemon serves, and this app. No Swift is written by hand — the
# Xcode project is generated by `cap add ios` on the runner, so nothing native
# is committed here.
on:
  push:
    branches: [main, "ios-*"]
    paths:
      - "dashboard/**"
      - ".github/workflows/ios-capacitor.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/ios-capacitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shell IPA
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: dashboard
        # Not frozen: the lockfile is maintained with a different pnpm major,
        # and this job only needs a reproducible-enough install to build once.
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        working-directory: dashboard
        run: pnpm test

      - name: Build web bundle
        working-directory: dashboard
        run: pnpm build

      - name: Verify the bundle Capacitor will embed
        working-directory: dashboard
        run: |
          test -f dist/index.html || { echo "dist/index.html missing — nothing to embed"; exit 1; }
          ls -la dist | head

      - name: Add iOS platform
        working-directory: dashboard
        run: pnpm exec cap add ios

      - name: Sync bundle into the native project
        working-directory: dashboard
        run: pnpm exec cap sync ios

      - name: Install app icon and launch image
        working-directory: dashboard
        # Generated rather than pulled from a tool: `cap add ios` ships the
        # Capacitor logo, and @capacitor/assets drags in sharp (which pnpm's
        # build-script policy rejects). This reads the asset catalog the
        # template actually generated and overwrites the files it references,
        # so it survives template changes.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os, shutil

          ICON = 'resources/icon.png'
          SPLASH = 'resources/splash.png'
          SPLASH_DARK = 'resources/splash-dark.png'
          for path in (ICON, SPLASH, SPLASH_DARK):
              assert os.path.exists(path), f'missing {path}'

          appicons = glob.glob('ios/**/Assets.xcassets/AppIcon.appiconset', recursive=True)
          splashes = glob.glob('ios/**/Assets.xcassets/Splash.imageset', recursive=True)
          assert appicons, 'AppIcon.appiconset not found in the generated project'
          print('icon set:', appicons, '| splash set:', splashes)

          def images_in(contents):
              """Every filename the catalog references, light and dark."""
              found = []
              if isinstance(contents.get('images'), list):
                  for image in contents['images']:
                      if isinstance(image, dict) and image.get('filename'):
                          found.append(image['filename'])
                      for value in image.values() if isinstance(image, dict) else []:
                          if isinstance(value, dict) and value.get('filename'):
                              found.append(value['filename'])
              return found

          # App icon: Xcode 14+ single-size catalog. Overwrite every PNG it
          # references with the 1024 source (iOS downsamples from there).
          for directory in appicons:
              contents_path = os.path.join(directory, 'Contents.json')
              contents = json.load(open(contents_path)) if os.path.exists(contents_path) else {}
              names = images_in(contents) or ['AppIcon-512@2x.png']
              for name in names:
                  shutil.copyfile(ICON, os.path.join(directory, name))
              json.dump(
                  {'images': [{'filename': names[0], 'idiom': 'universal', 'platform': 'ios', 'size': '1024x1024'}],
                   'info': {'author': 'xcode', 'version': 1}},
                  open(contents_path, 'w'), indent=2)
              print('app icon ->', names)

          # Launch image: Capacitor points LaunchScreen.storyboard at this set.
          for directory in splashes:
              contents_path = os.path.join(directory, 'Contents.json')
              contents = json.load(open(contents_path)) if os.path.exists(contents_path) else {}
              names = images_in(contents) or ['splash-2732x2732.png']
              for name in names:
                  source = SPLASH_DARK if 'dark' in name else SPLASH
                  shutil.copyfile(source, os.path.join(directory, name))
              print('launch images ->', names)
          PY

      - name: Configure Info.plist (ATS + camera)
        working-directory: dashboard
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist
          test -f "$PLIST" || { echo "Info.plist not found at $PLIST"; exit 1; }

          # Plain-http daemon URLs: LAN and tailnet pairing both use http, and
          # this is the same ATS exception the SwiftUI app ships with.
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$PLIST"

          # LocalNetwork usage prompt (bonjour/LAN discovery of the daemon).
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AgentDeck connects to the desktop running on your local network.'" "$PLIST" 2>/dev/null || true

          # Reserved for the in-app QR scanner plugin, so a future build needs no
          # second trip through review of the plist.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'AgentDeck uses the camera to scan the pairing code from your desktop.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool false" "$PLIST" 2>/dev/null || true

          plutil -p "$PLIST" | grep -A3 NSAppTransportSecurity || true

      - name: Build unsigned IPA
        working-directory: dashboard
        run: |
          set -euo pipefail
          # CocoaPods-based projects build from the workspace; SPM-based ones
          # from the project. Capacitor picks per environment.
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER="-workspace ios/App/App.xcworkspace"
          else
            CONTAINER="-project ios/App/App.xcodeproj"
          fi
          echo "Building with $CONTAINER"

          xcodebuild archive \
            $CONTAINER \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AgentDeckShell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

          mkdir -p build/Payload
          cp -R "build/AgentDeckShell.xcarchive/Products/Applications/App.app" build/Payload/AgentDeck.app
          cd build && zip -qry AgentDeck-shell-unsigned.ipa Payload

          echo "## iOS Capacitor shell" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned IPA: AgentDeck-shell-unsigned.ipa (re-sign with Sideloadly/AltStore)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-shell-ipa
          path: dashboard/build/AgentDeck-shell-unsigned.ipa
          retention-days: 14
