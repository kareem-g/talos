name: Mobile (React Native)

# Builds the React Native mobile client. The JS verification job runs on Ubuntu
# (fast feedback on every change); the iOS job runs on a macOS runner because an
# IPA cannot be produced on Linux. The Xcode project is generated on the runner
# by `expo prebuild` — no native iOS source is committed.
#
# The IPA is unsigned (CODE_SIGNING_ALLOWED=NO): re-sign it with Sideloadly or
# AltStore to install. Signing/TestFlight would need an Apple Developer account
# and the APPLE_* secrets; local notifications need none of that, which is the
# point of this client.
on:
  push:
    branches: [main, "ios-*"]
    paths:
      - "mobile/**"
      # The app imports the shared framework-agnostic core from the dashboard
      # (lib reducers/types), not its web components — so only those paths
      # warrant a mobile rebuild.
      - "dashboard/src/lib/**"
      - "dashboard/src/types/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "dashboard/src/lib/**"
      - "dashboard/src/types/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm install
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: mobile
        run: npx jest --ci
      # Design-system guards. `check:colors` fails on a raw hex in a component
      # and `check:tokens` fails on a token name used as a string
      # (`color="palette.ink3"` compiles and passes every test, then renders
      # nothing). Without these in CI the palette erodes one PR at a time.
      - name: Design-system guards
        working-directory: mobile
        run: npm run check:colors && npm run check:tokens
      # Cross-checks every HTTP call site against backend/src/daemon/server.rs,
      # so a route that the app calls but the daemon does not serve is caught
      # here rather than on a phone that cannot reach the desktop.
      - name: API routes match the backend
        working-directory: mobile
        run: npm run check:api

  build-ios:
    name: Build iOS IPA (unsigned)
    # The runner is pinned rather than floating. It was originally macos-26
    # because @callstack/liquid-glass needs the iOS 26 SDK, and that dependency
    # is gone as of the v2 redesign — but the pin stays until someone
    # deliberately re-tests the build on an older image, because an unpinned
    # `macos-latest` silently changes the toolchain underneath an IPA that
    # people then install by hand. See the Xcode gate below: it is now a
    # canary against that drift, not a hard dependency.
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          # Pin the toolchain instead of trusting the image default. A stale
          # default fails deep inside `pod install` with a message that does
          # not say why, and a silently different SDK produces an IPA that
          # behaves differently on a device than the one you tested.
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # Canary, not a requirement: if the image's default Xcode drops
          # below 26 the toolchain has moved under us and the IPA is no longer
          # the thing this job is documented to produce. Lower this together
          # with `runs-on`, and only after a green build on the older image.
          if ! xcodebuild -version | head -1 | grep -qE 'Xcode (2[6-9]|[3-9][0-9])'; then
            echo "::error::Xcode dropped below 26 on this image. Either re-pin runs-on to the image whose default is 26+, or lower this gate after a green build."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm install

      - name: Generate the native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Archive and package an unsigned IPA
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          # Derive the workspace and scheme from what prebuild generated rather
          # than hard-coding a name that could drift with the app config.
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Archiving $WORKSPACE (scheme: $SCHEME)"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/QAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

          mkdir -p ../build/Payload
          cp -R ../build/QAI.xcarchive/Products/Applications/*.app ../build/Payload/QAI.app
          cd ../build && zip -qry QAI-rn-unsigned.ipa Payload

          echo "## React Native iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned IPA: QAI-rn-unsigned.ipa (re-sign with Sideloadly/AltStore)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAI-rn-ios-ipa
          path: mobile/build/QAI-rn-unsigned.ipa
          retention-days: 14
