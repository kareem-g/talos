name: iOS Release

# The update pipeline for the AgentDeck iOS app.
#
# Push a tag `ios-v<version>` (e.g. ios-v1.0.0) to:
#   1. build a Release archive,
#   2. sign it when the Apple secrets below are configured
#      (otherwise the IPA is uploaded unsigned),
#   3. publish it as a GitHub Release with a fixed asset name,
#   4. publish an OTA install page + manifest.plist + version.json to the
#      `gh-pages` branch (signed builds only),
#   5. optionally upload to TestFlight when App Store Connect API secrets
#      are configured.
#
# Required secrets for signing (see docs/IOS_APP.md):
#   APPLE_CERT_P12_BASE64        base64 of the signing certificate .p12
#   APPLE_CERT_PASSWORD          password for that .p12
#   APPLE_PROVISION_PROFILE_BASE64  base64 of the .mobileprovision
#   APPLE_TEAM_ID                Apple Developer Team ID (10 chars)
# Optional:
#   APPLE_EXPORT_METHOD          development | ad-hoc | app-store  (default development)
#   APPLE_SIGNING_IDENTITY       e.g. "Apple Development" (default) / "iPhone Distribution"
#   APPLE_BUNDLE_ID              override com.agentdeck.ios
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64  for TestFlight upload

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish IPA
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.agentdeck.ios' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
      APPLE_EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD || 'development' }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || 'Apple Development' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing AgentDeck iOS $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Build signed IPA
        id: build
        run: |
          set -euo pipefail
          mkdir -p build
          VERSION="${{ steps.version.outputs.version }}"

          if [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$APPLE_PROVISION_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"

            # Temporary keychain with the signing identity.
            KEYCHAIN_PASSWORD="ci-$(uuidgen)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            echo "$APPLE_CERT_P12_BASE64" | base64 --decode > build/cert.p12
            security import build/cert.p12 -k build.keychain \
              -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASSWORD" build.keychain

            # Install the provisioning profile under its UUID so Xcode resolves it.
            echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > build/profile.mobileprovision
            security cms -D -i build/profile.mobileprovision > build/profile.plist
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' build/profile.plist)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' build/profile.plist)
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp build/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            echo "Using profile: $PROFILE_NAME ($PROFILE_UUID)"

            xcodebuild archive \
              -project ios/AgentDeck.xcodeproj \
              -scheme AgentDeck \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/AgentDeck.xcarchive \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
              -quiet

            cat > build/exportOptions.plist <<PLIST
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key>
              <string>${APPLE_EXPORT_METHOD}</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>${BUNDLE_ID}</key>
                <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingIdentity</key>
              <string>${APPLE_SIGNING_IDENTITY}</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>stripSwiftSymbols</key>
              <true/>
            </dict>
            </plist>
            PLIST

            xcodebuild -exportArchive \
              -archivePath build/AgentDeck.xcarchive \
              -exportOptionsPlist build/exportOptions.plist \
              -exportPath build/export \
              -quiet
            cp build/export/AgentDeck.ipa build/AgentDeck.ipa
            security delete-keychain build.keychain
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets not configured — building an UNSIGNED IPA (install via Sideloadly/AltStore, or set the APPLE_* secrets for a signed build)."

            xcodebuild archive \
              -project ios/AgentDeck.xcodeproj \
              -scheme AgentDeck \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/AgentDeck.xcarchive \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -quiet

            mkdir -p build/Payload
            cp -R "build/AgentDeck.xcarchive/Products/Applications/AgentDeck.app" build/Payload/
            (cd build && zip -qry AgentDeck.ipa Payload)
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$SIGNED" = "true" ]; then
            NOTES="Signed IPA ($APPLE_EXPORT_METHOD). Install over the air from the project Pages site, or download and install via Finder/Apple Configurator."
          else
            NOTES="Unsigned IPA — re-sign with Sideloadly/AltStore, or configure the APPLE_* secrets to produce a signed build."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "AgentDeck iOS $VERSION" \
            --notes "$NOTES" \
            --latest \
            build/AgentDeck.ipa

      - name: Publish OTA install page
        if: steps.build.outputs.signed == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          IPA_URL="https://github.com/$REPO/releases/download/$TAG/AgentDeck.ipa"
          PAGES_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages 2>/dev/null && git rev-parse --verify origin/gh-pages >/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . || true
          fi

          # itms-services install manifest for ad-hoc / development distribution.
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>${BUNDLE_ID}</string>
                  <key>bundle-version</key>
                  <string>${VERSION}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>AgentDeck</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          cat > index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Install AgentDeck</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
                     display: grid; place-items: center; min-height: 100vh;
                     background: #f2f2f7; color: #1c1c1e; text-align: center; }
              .card { background: #fff; border-radius: 18px; padding: 40px 32px;
                      max-width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
              .mark { width: 84px; height: 84px; border-radius: 18px; margin: 0 auto 16px;
                      background: linear-gradient(135deg, #313081, #fa595c);
                      display: grid; place-items: center; color: #fff;
                      font: 700 30px ui-monospace, monospace; }
              a.install { display: block; margin-top: 20px; padding: 14px;
                          background: #313081; color: #fff; border-radius: 12px;
                          text-decoration: none; font-weight: 600; }
              .version { color: #8e8e93; font-size: 13px; margin-top: 14px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="mark">AD</div>
              <h1>AgentDeck</h1>
              <p>Remote control for the agents on your machine.</p>
              <a class="install" href="itms-services://?action=download-manifest&url=${PAGES_BASE}/manifest.plist">Install / Update</a>
              <p class="version">Version ${VERSION} &middot; <a href="${RELEASE_URL}">Release notes</a></p>
            </div>
          </body>
          </html>
          HTML

          cat > version.json <<JSON
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "url": "${IPA_URL}",
            "release_url": "${RELEASE_URL}"
          }
          JSON

          git add manifest.plist index.html version.json
          git commit -m "OTA update: $TAG" || echo "Nothing to publish"
          git push origin gh-pages

          echo "## OTA published" >> "$GITHUB_STEP_SUMMARY"
          echo "Install page: ${PAGES_BASE}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8_BASE64 != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # App Store distribution requires an app-store signed build, which
          # is produced separately from the ad-hoc/development one above.
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "build/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "build/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"

          cat > build/ascExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild archive \
            -project ios/AgentDeck.xcodeproj \
            -scheme AgentDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AscAgentDeck.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -authenticationKeyPath "$PWD/build/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            -quiet

          xcodebuild -exportArchive \
            -archivePath build/AscAgentDeck.xcarchive \
            -exportOptionsPlist build/ascExportOptions.plist \
            -exportPath build/asc-export \
            -authenticationKeyPath "$PWD/build/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            -quiet

          xcrun altool --upload-app \
            --type ios \
            --file build/asc-export/AgentDeck.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "## TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded $VERSION to App Store Connect — process it in TestFlight." >> "$GITHUB_STEP_SUMMARY"
